<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>입주 전 실행과제 관리</title>
<style>
:root{
  --bg:#f6f7f9;--card:#fff;--text:#1f2430;--muted:#6b7280;--line:#e5e7eb;--accent:#2f6fed;
  --todo:#9ca3af;--doing:#2f6fed;--done:#16a34a;--hold:#d97706;--late:#dc2626;
}
@media (prefers-color-scheme:dark){
  :root{--bg:#14161b;--card:#1d2027;--text:#e8eaf0;--muted:#9aa1b0;--line:#2c313b;--accent:#6c9bff;}
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:14px/1.5 -apple-system,"Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",sans-serif}
header{padding:20px 16px 8px;max-width:1100px;margin:0 auto}
h1{margin:0 0 4px;font-size:20px}
.sub{color:var(--muted);font-size:13px}
main{max-width:1100px;margin:0 auto;padding:0 16px 60px}
.summary{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:8px;margin:12px 0}
.stat{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 12px;cursor:pointer}
.stat b{display:block;font-size:22px}
.stat span{color:var(--muted);font-size:12px}
.stat.on{outline:2px solid var(--accent)}
.bar{height:8px;background:var(--line);border-radius:99px;overflow:hidden;margin:6px 0 14px}
.bar i{display:block;height:100%;background:var(--done);width:0;transition:width .3s}
.tools{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}
.tools input,.tools select,button{font:inherit;color:var(--text);background:var(--card);border:1px solid var(--line);border-radius:8px;padding:7px 10px}
.tools input[type=search]{flex:1;min-width:160px}
button{cursor:pointer}
button.primary{background:var(--accent);border-color:var(--accent);color:#fff}
button.danger{color:var(--late)}
.group{margin-top:18px}
.group h2{font-size:15px;margin:0 0 8px;display:flex;justify-content:space-between;align-items:baseline}
.group h2 small{color:var(--muted);font-weight:400}
.task{background:var(--card);border:1px solid var(--line);border-left:4px solid var(--todo);border-radius:10px;padding:10px 12px;margin-bottom:8px;display:grid;gap:6px}
.task.s-doing{border-left-color:var(--doing)}
.task.s-done{border-left-color:var(--done);opacity:.75}
.task.s-hold{border-left-color:var(--hold)}
.task.late{border-left-color:var(--late)}
.top{display:flex;gap:8px;align-items:flex-start}
.no{color:var(--muted);min-width:22px}
.title{flex:1;font-weight:600;cursor:pointer}
.s-done .title{text-decoration:line-through}
.meta{display:flex;flex-wrap:wrap;gap:6px 14px;color:var(--muted);font-size:12.5px}
.meta b{color:var(--text);font-weight:500}
.badge{font-size:12px;border-radius:99px;padding:1px 8px;border:1px solid currentColor;white-space:nowrap}
.b-late{color:var(--late)}.b-soon{color:var(--hold)}.b-ok{color:var(--muted)}.b-done{color:var(--done)}
.note{font-size:12.5px;white-space:pre-wrap;background:var(--bg);border-radius:6px;padding:6px 8px}
.last{font-size:12.5px;color:var(--muted)}
select.st{font-weight:600}
dialog{border:1px solid var(--line);border-radius:12px;background:var(--card);color:var(--text);width:min(560px,94vw);padding:16px}
dialog::backdrop{background:rgba(0,0,0,.4)}
dialog label{display:block;font-size:12px;color:var(--muted);margin-top:10px}
dialog input,dialog select,dialog textarea{width:100%;font:inherit;color:var(--text);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:7px 9px;margin-top:3px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.actions{display:flex;gap:8px;justify-content:space-between;margin-top:16px}
.log{margin-top:8px;font-size:12.5px;max-height:130px;overflow:auto}
.log div{padding:3px 0;border-bottom:1px dashed var(--line)}
.empty{text-align:center;color:var(--muted);padding:30px}
footer{color:var(--muted);font-size:12px;margin-top:24px}
</style>
</head>
<body>
<header>
  <h1>🏠 입주 전 실행과제 관리</h1>
  <div class="sub">입주 전까지 반드시 진행해야 하는 건 · 담당자/일정 확정 및 진행상황 추적 · <span id="today"></span></div>
</header>
<main>
  <div class="summary" id="summary"></div>
  <div class="bar" title="완료율"><i id="bar"></i></div>

  <div class="tools">
    <input type="search" id="q" placeholder="검색 (업무, 담당자, 비고)">
    <select id="fOwner"><option value="">담당자 전체</option></select>
    <select id="fCat"><option value="">구분 전체</option></select>
    <button class="primary" id="add">＋ 과제 추가</button>
    <button id="export">내보내기</button>
    <button id="import">가져오기</button>
    <input type="file" id="file" accept="application/json" hidden>
  </div>

  <div id="list"></div>
  <footer>
    데이터는 이 브라우저(localStorage)에 저장됩니다. 팀과 공유하려면 <b>내보내기</b>로 JSON을 저장해 공유하고 상대는 <b>가져오기</b>로 불러오세요.
    <button id="reset" class="danger" style="float:right">초기 데이터로 되돌리기</button>
  </footer>
</main>

<dialog id="dlg">
  <form method="dialog" id="form">
    <b id="dlgTitle">과제 편집</b>
    <label>구분 <input name="cat" list="cats" required></label>
    <datalist id="cats"></datalist>
    <label>세부 업무 <textarea name="title" rows="2" required></textarea></label>
    <div class="row2">
      <label>제안 <input name="proposer"></label>
      <label>상태
        <select name="status"><option>미착수</option><option>진행중</option><option>완료</option><option>보류</option></select>
      </label>
      <label>담당(정) <input name="owner"></label>
      <label>담당(부) <input name="sub"></label>
      <label>착수일 <input type="date" name="start"></label>
      <label>완료일(기한) <input type="date" name="due"></label>
    </div>
    <label>비고 <textarea name="note" rows="3"></textarea></label>
    <label>진행 기록 추가 <input name="newlog" placeholder="오늘 진행 내용을 한 줄로 (저장 시 날짜와 함께 기록)"></label>
    <div class="log" id="logs"></div>
    <div class="actions">
      <button type="button" class="danger" id="del">삭제</button>
      <span>
        <button type="button" id="cancel">취소</button>
        <button type="submit" class="primary" value="save">저장</button>
      </span>
    </div>
  </form>
</dialog>

<script>
const KEY = "moveInTasks.v1";
const STATUSES = ["미착수","진행중","완료","보류"];
const d = s => s; // dates kept as ISO strings
const SEED = [
 {id:1,cat:"① 계약·자금",title:"임차계약조건 최종 협의 (세대별 전세보증금액 및 자금 준비 일정 확인)",proposer:"찬승, 희원",owner:"임한결",sub:"양찬승",start:"2026-11-01",due:"2027-02-28",note:""},
 {id:2,cat:"① 계약·자금",title:"건물/토지 감정평가 의뢰 (HUG)",proposer:"찬승",owner:"양찬승",sub:"임한결",start:"2026-12-10",due:"2026-12-31",note:"1월말 전세대출 접수 가능하도록 셋업 계획.\n→ 12월 초 감정평가 받도록 착수일을 1개월 앞당김"},
 {id:3,cat:"② 공사·시설 (자체 준비 필요)",title:"옥상 공간 조성 방안",proposer:"한결, 정현",owner:"인테리어TF",sub:"",start:"2026-10-01",due:"",note:""},
 {id:4,cat:"② 공사·시설 (자체 준비 필요)",title:"전기차 충전소 관련 (기기/업체 선정, 설치, 정산 등)",proposer:"정현",owner:"손택근",sub:"",start:"2027-02-01",due:"2027-02-28",note:""},
 {id:5,cat:"② 공사·시설 (자체 준비 필요)",title:"태양광 판넬 (기기/업체 선정, 설치, 정산 등)",proposer:"한결",owner:"박영미",sub:"송정현",start:"2027-01-01",due:"",note:"공공지원 등 고려 필요"},
 {id:6,cat:"③ 공용 가구·가전",title:"공용부 기증·구매 가구/가전 리스트 취합 (아동용품 포함)",proposer:"희원",owner:"인테리어TF",sub:"",start:"2026-10-01",due:"",note:""},
 {id:7,cat:"③ 공용 가구·가전",title:"공동육아실 대형 기물·시설 리스트 작성",proposer:"희원",owner:"박석원",sub:"김은혜",start:"2026-10-01",due:"",note:""},
 {id:8,cat:"④ 입주 일정",title:"세대별 입주 일정 확인 (가구별 입주 스케줄 공유 시트 만들기)",proposer:"희원",owner:"",sub:"",start:"2026-09-20",due:"",note:"2月 중: 하늘\n2月 말: 하담, 새봄, 이든\n3月 초: 룬슬\n3月 중: 쌀살, 튼튼, 푸른\n4月 초: 시완"},
 {id:9,cat:"⑤ 공용공간별 이용 및 관리규칙",title:"주차장",proposer:"한결",owner:"김성현",sub:"",start:"2026-10-01",due:"2027-02-28",note:"혜림교회 월주차 2만원 (확인필요)"},
 {id:10,cat:"⑤ 공용공간별 이용 및 관리규칙",title:"2층 공용공간",proposer:"",owner:"우명진",sub:"박영미, 최희원",start:"2026-10-01",due:"2027-02-28",note:"GX 담당: 최희원"},
 {id:11,cat:"⑤ 공용공간별 이용 및 관리규칙",title:"공동육아실",proposer:"",owner:"김지윤",sub:"박민지",start:"2026-10-01",due:"2027-02-28",note:""},
 {id:12,cat:"⑤ 공용공간별 이용 및 관리규칙",title:"공용식당 (주방, 게스트 식당, 공동식사 포함)",proposer:"",owner:"송서연",sub:"정자연",start:"2026-10-01",due:"2027-02-28",note:""},
 {id:13,cat:"⑤ 공용공간별 이용 및 관리규칙",title:"게스트룸, 지하창고, 옥상/계단실 등 기타 공용공간",proposer:"",owner:"김형권",sub:"",start:"2026-10-01",due:"2027-02-28",note:""},
 {id:14,cat:"⑥ 공동체 운영",title:"자립준비청년 관계형성 계획 및 202호 운영 방안 (입주~퇴소 운영 방식·참여 독려 방안, 공실활용)",proposer:"찬승/정현",owner:"김대현",sub:"오승환",start:"2026-11-01",due:"2027-02-28",note:""},
 {id:15,cat:"⑥ 공동체 운영",title:"연마을 송년 워크샵",proposer:"한결",owner:"이사회",sub:"",start:"2026-11-01",due:"2026-11-30",note:""},
 {id:16,cat:"⑥ 공동체 운영",title:"공용부 화재보험·배상책임보험 검토",proposer:"찬승",owner:"김성현",sub:"",start:"2027-01-01",due:"2027-02-28",note:""}
].map(t=>({...t,status:"미착수",log:[]}));

const $ = s => document.querySelector(s);
const esc = s => String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const todayStr = () => { const t=new Date(); return new Date(t-t.getTimezoneOffset()*6e4).toISOString().slice(0,10); };
const days = (a,b) => Math.round((new Date(a)-new Date(b))/864e5);

let tasks, filter = {status:"",q:"",owner:"",cat:""}, editing = null;

function load(){
  try{ const r=JSON.parse(localStorage.getItem(KEY)); if(Array.isArray(r)) return r; }catch(e){}
  return structuredClone(SEED);
}
function save(){ try{ localStorage.setItem(KEY,JSON.stringify(tasks)); }catch(e){} }

function people(t){ return [t.owner,...String(t.sub||"").split(/[,，]/)].map(s=>s.trim()).filter(Boolean); }
function isLate(t){ return t.status!=="완료" && t.status!=="보류" && ((t.due && t.due<todayStr()) || (t.status==="미착수" && t.start && t.start<todayStr())); }

function dueBadge(t){
  if(t.status==="완료") return `<span class="badge b-done">완료</span>`;
  if(!t.due) return `<span class="badge b-ok">기한 미정</span>`;
  const n = days(t.due,todayStr());
  if(n<0) return `<span class="badge b-late">기한 ${-n}일 초과</span>`;
  if(n<=14) return `<span class="badge b-soon">D-${n}</span>`;
  return `<span class="badge b-ok">D-${n}</span>`;
}

function visible(t){
  if(filter.status==="지연"){ if(!isLate(t)) return false; }
  else if(filter.status && t.status!==filter.status) return false;
  if(filter.owner && !people(t).includes(filter.owner)) return false;
  if(filter.cat && t.cat!==filter.cat) return false;
  if(filter.q){
    const hay=[t.title,t.owner,t.sub,t.proposer,t.note,t.cat].join(" ").toLowerCase();
    if(!hay.includes(filter.q.toLowerCase())) return false;
  }
  return true;
}

function renderSummary(){
  const c = s => tasks.filter(t=>t.status===s).length;
  const late = tasks.filter(isLate).length;
  const items = [["","전체",tasks.length],["미착수","미착수",c("미착수")],["진행중","진행중",c("진행중")],["완료","완료",c("완료")],["보류","보류",c("보류")],["지연","⚠ 지연",late]];
  $("#summary").innerHTML = items.map(([k,l,n])=>`<div class="stat ${filter.status===k?"on":""}" data-k="${k}"><b>${n}</b><span>${l}</span></div>`).join("");
  $("#bar").style.width = tasks.length? (c("완료")/tasks.length*100)+"%":"0";
}

function renderFilters(){
  const owners=[...new Set(tasks.flatMap(people))].sort((a,b)=>a.localeCompare(b,"ko"));
  const cats=[...new Set(tasks.map(t=>t.cat))];
  $("#fOwner").innerHTML = `<option value="">담당자 전체</option>`+owners.map(o=>`<option ${o===filter.owner?"selected":""}>${esc(o)}</option>`).join("");
  $("#fCat").innerHTML = `<option value="">구분 전체</option>`+cats.map(o=>`<option ${o===filter.cat?"selected":""}>${esc(o)}</option>`).join("");
  $("#cats").innerHTML = cats.map(o=>`<option value="${esc(o)}">`).join("");
}

function renderList(){
  const vis = tasks.filter(visible);
  if(!vis.length){ $("#list").innerHTML=`<div class="empty">조건에 맞는 과제가 없습니다.</div>`; return; }
  const groups = {};
  vis.forEach(t=>(groups[t.cat] ||= []).push(t));
  $("#list").innerHTML = Object.entries(groups).map(([cat,ts])=>{
    const done = tasks.filter(t=>t.cat===cat && t.status==="완료").length, all = tasks.filter(t=>t.cat===cat).length;
    return `<section class="group"><h2>${esc(cat)} <small>${done}/${all} 완료</small></h2>`+ts.map(t=>{
      const last = t.log && t.log[t.log.length-1];
      return `<article class="task s-${{"미착수":"todo","진행중":"doing","완료":"done","보류":"hold"}[t.status]} ${isLate(t)?"late":""}" data-id="${t.id}">
        <div class="top">
          <span class="no">${t.id}</span>
          <span class="title" data-edit>${esc(t.title)}</span>
          ${dueBadge(t)}
          <select class="st" data-st>${STATUSES.map(s=>`<option ${s===t.status?"selected":""}>${s}</option>`).join("")}</select>
        </div>
        <div class="meta">
          <span>담당(정) <b>${esc(t.owner)||"미정"}</b></span>
          ${t.sub?`<span>담당(부) <b>${esc(t.sub)}</b></span>`:""}
          ${t.proposer?`<span>제안 <b>${esc(t.proposer)}</b></span>`:""}
          <span>착수 <b>${t.start||"-"}</b></span>
          <span>완료 <b>${t.due||"-"}</b></span>
        </div>
        ${t.note?`<div class="note">${esc(t.note)}</div>`:""}
        ${last?`<div class="last">📝 ${last.date} · ${esc(last.text)}${t.log.length>1?` (외 ${t.log.length-1}건)`:""}</div>`:""}
      </article>`;
    }).join("")+`</section>`;
  }).join("");
}

function render(){ renderSummary(); renderFilters(); renderList(); }

/* events */
$("#today").textContent = "오늘 " + todayStr();
$("#summary").onclick = e => { const s=e.target.closest(".stat"); if(!s) return; filter.status = filter.status===s.dataset.k? "" : s.dataset.k; render(); };
$("#q").oninput = e => { filter.q=e.target.value; renderList(); };
$("#fOwner").onchange = e => { filter.owner=e.target.value; renderList(); };
$("#fCat").onchange = e => { filter.cat=e.target.value; renderList(); };
$("#list").onclick = e => { if(e.target.closest("[data-edit]")) openEdit(+e.target.closest(".task").dataset.id); };
$("#list").onchange = e => {
  if(!e.target.matches("[data-st]")) return;
  const t = tasks.find(x=>x.id==e.target.closest(".task").dataset.id);
  t.status = e.target.value; save(); render();
};

function openEdit(id){
  editing = id ? tasks.find(t=>t.id===id) : null;
  const f = $("#form");
  const t = editing || {cat:filter.cat||"",title:"",proposer:"",owner:"",sub:"",start:"",due:"",status:"미착수",note:"",log:[]};
  ["cat","title","proposer","owner","sub","start","due","status","note"].forEach(k=>f[k].value=t[k]||"");
  f.newlog.value="";
  $("#dlgTitle").textContent = editing? `과제 ${t.id} 편집` : "새 과제 추가";
  $("#del").style.display = editing? "" : "none";
  $("#logs").innerHTML = [...(t.log||[])].reverse().map(l=>`<div>${l.date} · ${esc(l.text)}</div>`).join("");
  $("#dlg").showModal();
}
$("#add").onclick = () => openEdit(0);
$("#cancel").onclick = () => $("#dlg").close();
$("#del").onclick = () => { if(confirm("이 과제를 삭제할까요?")){ tasks=tasks.filter(t=>t!==editing); save(); render(); $("#dlg").close(); } };
$("#form").onsubmit = e => {
  const f = e.target;
  const data = Object.fromEntries(["cat","title","proposer","owner","sub","start","due","status","note"].map(k=>[k,f[k].value.trim()]));
  let t = editing;
  if(!t){ t={id:Math.max(0,...tasks.map(x=>x.id))+1,log:[]}; tasks.push(t); }
  Object.assign(t,data);
  t.log ||= [];
  if(f.newlog.value.trim()) t.log.push({date:todayStr(),text:f.newlog.value.trim()});
  save(); render();
};

$("#export").onclick = () => {
  const a=document.createElement("a");
  a.href=URL.createObjectURL(new Blob([JSON.stringify(tasks,null,2)],{type:"application/json"}));
  a.download=`실행과제_${todayStr()}.json`; a.click(); URL.revokeObjectURL(a.href);
};
$("#import").onclick = () => $("#file").click();
$("#file").onchange = async e => {
  const f=e.target.files[0]; if(!f) return;
  try{
    const r=JSON.parse(await f.text());
    if(!Array.isArray(r)||!r.every(t=>t.id&&t.title)) throw 0;
    if(confirm("현재 데이터를 불러온 파일로 덮어쓸까요?")){ tasks=r; save(); render(); }
  }catch(_){ alert("올바른 JSON 파일이 아닙니다."); }
  e.target.value="";
};
$("#reset").onclick = () => { if(confirm("모든 진행상황이 지워지고 초기 데이터로 돌아갑니다. 계속할까요?")){ tasks=structuredClone(SEED); save(); render(); } };

tasks = load();
render();
</script>
</body>
</html>
